<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Console PARIS - Régie Stable</title>
    <style>
        body { background: #0f0f0f; color: #eee; font-family: sans-serif; text-align: center; padding: 20px; }
        .grid { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        .video-box { width: 45%; background: #1e1e1e; padding: 10px; border-radius: 12px; border: 1px solid #333; }
        video { width: 100%; border-radius: 8px; background: #000; aspect-ratio: 16/9; }
        .status-bar { display: flex; justify-content: center; gap: 15px; margin: 20px 0; }
        .indicator { padding: 5px 15px; border-radius: 20px; font-size: 12px; background: #333; }
        .online { background: #0044aa; color: #00d4ff; border: 1px solid #00d4ff; }
        button { padding: 15px 30px; background: #00d4ff; color: #111; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        #console { background: #000; color: #00d4ff; font-family: monospace; padding: 10px; height: 80px; overflow-y: auto; margin-top: 20px; text-align: left; font-size: 11px; }
    </style>
</head>
<body>
    <h1>📍 CONSOLE PARIS</h1>

    <div class="status-bar">
        <div id="ind-server" class="indicator">SERVEUR: OFF</div>
        <div id="ind-out" class="indicator">SORTIE OBS NANTES: OFF</div>
        <div id="ind-in" class="indicator">RETOUR NANTES: OFF</div>
    </div>
    
    <div class="grid">
        <div class="video-box">
            <p>MA CAMÉRA (PARIS)</p>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
        <div class="video-box">
            <p>RETOUR NANTES</p>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>

    <div style="margin-top: 20px;">
        <button id="startCall">🔴 ENVOYER VERS NANTES (OBS + RÉGIE)</button>
    </div>

    <div id="console">--- Système prêt (Paris) ---</div>

    <script>
        const log = (m) => { const c = document.getElementById('console'); c.innerHTML += `> ${m}<br>`; c.scrollTop = c.scrollHeight; };
        const setInd = (id, on, txt) => { const el = document.getElementById(id); el.className = on ? 'indicator online' : 'indicator'; if(txt) el.innerText = txt; };

        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const sig = new WebSocket('wss://railway-webrtc-production.up.railway.app');
        const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
        
        let localStream;
        let pcs = {}; 

        // 1. Initialisation Caméra
        navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(s => {
            localStream = s;
            localVideo.srcObject = s;
            log("Caméra Paris prête");
        });

        // 2. Connexion Signalisation
        sig.onopen = () => {
            sig.send(JSON.stringify({ type: 'login', name: 'paris' }));
            setInd('ind-server', true, "SERVEUR: OK");
            log("Paris connecté au serveur Railway");
        };

        sig.onmessage = async (msg) => {
            const data = JSON.parse(msg.data);
            
            // LOGIQUE DE RÉPONSE AUTOMATIQUE
            if (data.type === 'offer') {
                log("Offre reçue de : " + data.from);
                const pc = createPC(data.from);
                await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
                const ans = await pc.createAnswer();
                await pc.setLocalDescription(ans);
                sig.send(JSON.stringify({ type: 'answer', target: data.from, answer: ans }));
                if(data.from === 'nantes') setInd('ind-in', true, "RETOUR NANTES: LIVE");
            } 
            else if (data.type === 'answer') {
                if (pcs[data.from]) {
                    await pcs[data.from].setRemoteDescription(new RTCSessionDescription(data.answer));
                    if(data.from === 'obs_nantes') setInd('ind-out', true, "SORTIE OBS: OK");
                }
            } 
            else if (data.type === 'candidate') {
                if (pcs[data.from]) {
                    await pcs[data.from].addIceCandidate(new RTCIceCandidate(data.candidate)).catch(e => {});
                }
            }
        };

        // 3. Création de connexion générique (Émission ou Réception)
        function createPC(target) {
            if (pcs[target]) return pcs[target];

            const pc = new RTCPeerConnection(config);
            pcs[target] = pc;

            pc.onicecandidate = e => {
                if (e.candidate) sig.send(JSON.stringify({ type: 'candidate', target: target, candidate: e.candidate }));
            };

            pc.ontrack = e => {
                log("Flux vidéo reçu de : " + target);
                if (target === 'nantes') {
                    remoteVideo.srcObject = e.streams[0];
                    remoteVideo.play();
                }
            };

            if (localStream) {
                localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
            }

            return pc;
        }

        // 4. Lancement manuel de la diffusion
        document.getElementById('startCall').onclick = async () => {
            // Paris envoie à ta console Nantes ET à ton OBS Nantes
            const targets = ['nantes', 'obs_nantes'];
            
            for (const target of targets) {
                log("Appel de " + target + "...");
                const pc = createPC(target);
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                sig.send(JSON.stringify({ type: 'offer', target: target, offer: offer, from: 'paris' }));
            }
        };
    </script>
</body>
</html>

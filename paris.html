<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Console PARIS - Envoi</title>
    <style>
        body { background: #111; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        video { width: 80%; max-width: 720px; border: 2px solid #00d4ff; border-radius: 8px; background: black; }
        button { padding: 15px 30px; background: #00d4ff; color: #111; border: none; border-radius: 5px; cursor: pointer; font-size: 18px; font-weight: bold; margin-top: 20px; }
        #status { color: #aaa; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>📍 CONSOLE PARIS</h1>
    <video id="localVideo" autoplay playsinline muted></video>
    <div>
        <button id="startBtn">🔴 ENVOYER VERS NANTES</button>
        <p id="status">Statut : Prêt</p>
    </div>

    <script>
        const sig = new WebSocket('wss://railway-webrtc-production.up.railway.app');
        const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
        let localStream;
        let peerConnections = {};

        navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 }, audio: true })
            .then(stream => {
                localStream = stream;
                document.getElementById('localVideo').srcObject = stream;
            });

        sig.onopen = () => sig.send(JSON.stringify({ type: 'login', name: 'paris' }));

        document.getElementById('startBtn').onclick = async () => {
            const targets = ['nantes', 'obs_nantes']; 
            document.getElementById('status').innerText = "📡 Envoi en cours...";

            for (const target of targets) {
                const pc = new RTCPeerConnection(config);
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

                pc.onicecandidate = e => {
                    if (e.candidate) sig.send(JSON.stringify({ type: 'candidate', target: target, candidate: e.candidate }));
                };

                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                sig.send(JSON.stringify({ type: 'offer', target: target, offer: offer, from: 'paris' }));
                peerConnections[target] = pc;
            }
        };

        sig.onmessage = async (msg) => {
            const data = JSON.parse(msg.data);
            let pc = peerConnections[data.from];
            if (data.type === 'answer' && pc) {
                await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
                document.getElementById('status').innerText = "✅ CONNECTÉ À NANTES";
            } else if (data.type === 'candidate' && pc) {
                await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Poste NANTES - WebRTC</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #1a1a1a; color: white; }
        .video-container { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        video { width: 45%; max-width: 600px; border: 3px solid #007bff; border-radius: 10px; background: #000; }
        #localVideo { border-color: #6c757d; width: 25%; } /* Ma caméra est plus petite */
        .controls { margin-top: 20px; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 5px; transition: 0.3s; }
        button:hover { background: #218838; }
        .status { color: #ffc107; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>📍 Poste : PARIS</h1>
    <div class="status" id="status">Connexion au serveur...</div>
    
    <div class="video-container">
        <video id="localVideo" autoplay playsinline muted title="Moi (Nantes)"></video>
        <video id="remoteVideo" autoplay playsinline title="Paris"></video>
    </div>

    <div class="controls">
        <button id="startCall">Appeler PARIS 📞</button>
    </div>

    <script>
        const myId = 'paris';
        const targetId = 'nantes';
        const configuration = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
        
        let pc;
        let localStream;
        const signaling = new WebSocket('wss://td-signaling-server-production.up.railway.app');

        async function init() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('localVideo').srcObject = localStream;
                updateStatus("Caméra prête. Prêt à appeler.");
            } catch (e) {
                updateStatus("Erreur caméra : " + e.message);
            }
        }

        signaling.onopen = () => {
            signaling.send(JSON.stringify({ type: 'login', name: myId }));
            updateStatus("Connecté au serveur. En attente de Paris...");
        };

        signaling.onmessage = async (message) => {
            const data = JSON.parse(message.data);
            if (data.type === 'offer') {
                await handleOffer(data.offer, data.from);
            } else if (data.type === 'answer') {
                await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
                updateStatus("Appel en cours avec Paris");
            } else if (data.type === 'candidate') {
                if (pc) await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        };

        function createPeerConnection(remoteUser) {
            pc = new RTCPeerConnection(configuration);
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    signaling.send(JSON.stringify({ type: 'candidate', target: remoteUser, candidate: event.candidate }));
                }
            };
            pc.ontrack = (event) => {
                document.getElementById('remoteVideo').srcObject = event.streams[0];
            };
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
        }

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Console NANTES - Émetteur</title>
    <style>
        body { background: #0f0f0f; color: #eee; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; margin: 0; }
        
        /* Dashboard Stats */
        .dashboard { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; }
        .stat-card { background: #1e1e1e; padding: 12px 20px; border-radius: 8px; border-left: 5px solid #444; min-width: 200px; text-align: left; transition: 0.3s; }
        .online { border-left-color: #00ff88; box-shadow: 0 0 10px rgba(0, 255, 136, 0.2); }
        .pending { border-left-color: #ffab00; }
        .offline { border-left-color: #ff3333; }
        .stat-label { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 14px; font-weight: bold; margin-top: 4px; }

        video { width: 80%; max-width: 900px; border: 2px solid #333; border-radius: 12px; background: black; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .controls { margin-top: 25px; }
        button { padding: 18px 40px; background: #e91111; color: white; border: none; border-radius: 50px; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.3s; }
        button:hover { background: #ff4b2b; transform: scale(1.05); }

        #log-console { max-width: 900px; margin: 25px auto 0; height: 120px; background: #000; color: #00ff88; font-family: monospace; font-size: 12px; padding: 15px; overflow-y: auto; text-align: left; border-radius: 8px; border: 1px solid #333; }
    </style>
</head>
<body>
    <h1>📍 CONSOLE NANTES</h1>

    <div class="dashboard">
        <div id="status-server" class="stat-card offline">
            <div class="stat-label">Signalisation Railway</div>
            <div class="stat-value">DÉCONNECTÉ</div>
        </div>
        <div id="status-webrtc" class="stat-card offline">
            <div class="stat-label">Lien WebRTC (Flux)</div>
            <div class="stat-value">HORS LIGNE</div>
        </div>
    </div>

    <video id="localVideo" autoplay playsinline muted></video>
    
    <div class="controls">
        <button id="startBtn">🔴 ENVOYER LE FLUX VERS PARIS</button>
    </div>

    <div id="log-console">> Initialisation du système...</div>

    <script>
        const log = (m) => {
            const c = document.getElementById('log-console');
            c.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${m}</div>`;
            c.scrollTop = c.scrollHeight;
        };

        const updateUI = (id, state, txt) => {
            const el = document.getElementById(`status-${id}`);
            if(el) {
                el.className = `stat-card ${state}`;
                el.querySelector('.stat-value').innerText = txt.toUpperCase();
            }
        };

        const sig = new WebSocket('wss://railway-webrtc-production.up.railway.app');
        const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
        let localStream;
        let pc;

        // Capture 1080p
        navigator.mediaDevices.getUserMedia({ 
            video: { width: 1920, height: 1080 }, 
            audio: true 
        }).then(stream => {
            localStream = stream;
            document.getElementById('localVideo').srcObject = stream;
            log("Caméra 1080p prête.");
        });

        sig.onopen = () => {
            sig.send(JSON.stringify({ type: 'login', name: 'nantes' }));
            updateUI('server', 'online', 'Connecté');
            log("Login réussi sur Railway.");
        };

        sig.onclose = () => {
            updateUI('server', 'offline', 'Serveur perdu');
            log("Connexion au serveur perdue.");
        };

        document.getElementById('startBtn').onclick = async () => {
            log("Démarrage de la négociation...");
            updateUI('webrtc', 'pending', 'Négociation...');
            
            pc = new RTCPeerConnection(config);
            
            // --- WATCHDOG ---
            pc.onconnectionstatechange = () => {
                log("État WebRTC : " + pc.connectionState);
                if (pc.connectionState === 'connected') {
                    updateUI('webrtc', 'online', 'Flux Actif');
                } else if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
                    updateUI('webrtc', 'offline', 'Lien Perdu');
                }
            };

            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            pc.onicecandidate = e => {
                if (e.candidate) sig.send(JSON.stringify({ type: 'candidate', target: 'obs_paris', candidate: e.candidate }));
            };

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            sig.send(JSON.stringify({ type: 'offer', target: 'obs_paris', offer: offer, from: 'nantes' }));
            
            sig.onmessage = async (msg) => {
                const data = JSON.parse(msg.data);
                if (data.type === 'answer') {
                    log("Réponse reçue de Paris.");
                    await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
                }
                if (data.type === 'candidate') {
                    await pc.addIceCandidate(new RTCIceCandidate(data.candidate)).catch(e => {});
                }
            };
        };
    </script>
</body>
</html>

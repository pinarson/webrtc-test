<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Console NANTES - Dashboard Pro</title>
    <style>
        body { background: #0f0f0f; color: #eee; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; margin: 0; }
        
        /* Dashboard Stats */
        .dashboard { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; }
        .stat-card { background: #1e1e1e; padding: 12px 20px; border-radius: 8px; border-left: 5px solid #444; min-width: 200px; text-align: left; transition: 0.3s; }
        .online { border-left-color: #00ff88; box-shadow: 0 0 10px rgba(0, 255, 136, 0.2); }
        .pending { border-left-color: #ffab00; }
        .offline { border-left-color: #ff3333; }
        .stat-label { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 14px; font-weight: bold; margin-top: 4px; }

        /* Device Selectors */
        .selectors { background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 20px; display: inline-flex; gap: 20px; border: 1px solid #333; }
        .select-group { text-align: left; }
        label { display: block; font-size: 10px; color: #888; margin-bottom: 5px; text-transform: uppercase; }
        select { background: #333; color: white; border: 1px solid #444; padding: 8px; border-radius: 5px; min-width: 200px; outline: none; }

        video { width: 80%; max-width: 900px; border: 2px solid #333; border-radius: 12px; background: black; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .controls { margin-top: 25px; }
        button { padding: 18px 40px; background: #e91111; color: white; border: none; border-radius: 50px; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.3s; }
        button:hover { background: #ff4b2b; transform: scale(1.05); }

        #log-console { max-width: 900px; margin: 25px auto 0; height: 120px; background: #000; color: #00ff88; font-family: monospace; font-size: 12px; padding: 15px; overflow-y: auto; text-align: left; border-radius: 8px; border: 1px solid #333; }
    </style>
</head>
<body>
    <h1>📍 CONSOLE NANTES</h1>

    <div class="selectors">
        <div class="select-group">
            <label>Source Vidéo</label>
            <select id="videoSource"></select>
        </div>
    </div>

    <div class="select-group">
            <label>Microphone</label>
            <select id="audioSource"></select>
        </div>
    </div>


    <div class="dashboard">
        <div id="status-server" class="stat-card offline">
            <div class="stat-label">Signalisation Railway</div>
            <div class="stat-value">DÉCONNECTÉ</div>
        </div>
        <div id="status-webrtc" class="stat-card offline">
            <div class="stat-label">Lien WebRTC (Flux)</div>
            <div class="stat-value">HORS LIGNE</div>
        </div>
    </div>



    <br>
    <video id="localVideo" autoplay playsinline muted></video>
    
    <div class="controls">
        <button id="startBtn">🔴 ENVOYER LE FLUX VERS PARIS</button>
    </div>

    <div id="log-console">> Initialisation du système...</div>

    <script>
        const log = (m) => {
            const c = document.getElementById('log-console');
            c.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${m}</div>`;
            c.scrollTop = c.scrollHeight;
        };

        const updateUI = (id, state, txt) => {
            const el = document.getElementById(`status-${id}`);
            if(el) {
                el.className = `stat-card ${state}`;
                el.querySelector('.stat-value').innerText = txt.toUpperCase();
            }
        };

        const videoSelect = document.querySelector('select#videoSource');
        const audioSelect = document.querySelector('select#audioSource');
        const sig = new WebSocket('wss://railway-webrtc-production.up.railway.app');
        const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
        let localStream;
        let pc;
        let watchdogTimer = null;

        // --- LISTER LES PÉRIPHÉRIQUES ---
        async function getDevices() {
            const devices = await navigator.mediaDevices.enumerateDevices();
            videoSelect.innerHTML = '';
            audioSelect.innerHTML = '';
            devices.forEach(device => {
                const option = document.createElement('option');
                option.value = device.deviceId;
                if (device.kind === 'videoinput') {
                    option.text = device.label || `Caméra ${videoSelect.length + 1}`;
                    videoSelect.appendChild(option);
                } else if (device.kind === 'audioinput') {
                    option.text = device.label || `Micro ${audioSelect.length + 1}`;
                    audioSelect.appendChild(option);
                }
            });
        }

        // --- CAPTURE DES SOURCES CHOISIES ---
        async function startCapture() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            const videoSource = videoSelect.value;
            const audioSource = audioSelect.value;
            const constraints = {
                video: { deviceId: videoSource ? { exact: videoSource } : undefined, width: 1920, height: 1080 },
                audio: { deviceId: audioSource ? { exact: audioSource } : undefined }
            };
            try {
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById('localVideo').srcObject = localStream;
                log("Flux média mis à jour.");
                
                // Si on est déjà en live, on remplace la piste
                if (pc) {
                    const videoTrack = localStream.getVideoTracks()[0];
                    const audioTrack = localStream.getAudioTracks()[0];
                    const videoSender = pc.getSenders().find(s => s.track.kind === 'video');
                    const audioSender = pc.getSenders().find(s => s.track.kind === 'audio');
                    if (videoSender) videoSender.replaceTrack(videoTrack);
                    if (audioSender) audioSender.replaceTrack(audioTrack);
                    log("Pistes WebRTC remplacées à chaud.");
                }
            } catch (e) {
                log("Erreur capture : " + e.message);
            }
        }

        // Initialisation
        navigator.mediaDevices.getUserMedia({ audio: true, video: true })
            .then(() => getDevices().then(startCapture))
            .catch(e => log("Permission refusée."));

        videoSelect.onchange = startCapture;
        audioSelect.onchange = startCapture;

        sig.onopen = () => {
            sig.send(JSON.stringify({ type: 'login', name: 'nantes' }));
            updateUI('server', 'online', 'Connecté');
            log("Login Railway OK.");
        };

        // --- FONCTION DE STREAMING ---
        async function startStreaming() {
            log("🔄 Lancement WebRTC...");
            updateUI('webrtc', 'pending', 'Négociation...');
            if (pc) pc.close();

            pc = new RTCPeerConnection(config);
            
            pc.onconnectionstatechange = () => {
                const state = pc.connectionState;
                log("État : " + state);
                if (state === 'connected') {
                    updateUI('webrtc', 'online', 'Flux Actif');
                    clearTimeout(watchdogTimer);
                    watchdogTimer = null;
                } else if (state === 'failed' || state === 'disconnected') {
                    updateUI('webrtc', 'offline', 'Lien Perdu');
                    if (!watchdogTimer) {
                        watchdogTimer = setTimeout(() => {
                            log("🔄 Auto-Healing...");
                            startStreaming();
                            watchdogTimer = null;
                        }, 5000);
                    }
                }
            };

            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            pc.onicecandidate = e => {
                if (e.candidate) sig.send(JSON.stringify({ type: 'candidate', target: 'obs_paris', candidate: e.candidate }));
            };

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            sig.send(JSON.stringify({ type: 'offer', target: 'obs_paris', offer: offer, from: 'nantes' }));
        }

        document.getElementById('startBtn').onclick = startStreaming;

        sig.onmessage = async (msg) => {
            const data = JSON.parse(msg.data);
            if (data.type === 'answer' && pc) {
                await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
            }
            if (data.type === 'candidate' && pc) {
                await pc.addIceCandidate(new RTCIceCandidate(data.candidate)).catch(() => {});
            }
        };
    </script>
</body>
</html>

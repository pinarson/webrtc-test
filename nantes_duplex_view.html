<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Nantes - Régie Master</title>
    <style>
        body { background: #0f0f0f; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        
        /* --- Dashboard Stats --- */
        .dashboard { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .stat-card { background: #1e1e1e; padding: 10px 20px; border-radius: 8px; border-left: 4px solid #444; min-width: 200px; text-align: left; }
        .stat-card.online { border-left-color: #00ff88; }
        .stat-card.offline { border-left-color: #ff3333; }
        .stat-card.pending { border-left-color: #ffab00; }
        .stat-label { font-size: 10px; color: #888; text-transform: uppercase; }
        .stat-value { font-size: 14px; font-weight: bold; margin-top: 4px; }

        .grid { display: flex; justify-content: center; gap: 20px; }
        .video-box { width: 48%; background: #1e1e1e; padding: 10px; border-radius: 12px; position: relative; }
        video { width: 100%; border-radius: 8px; background: #000; aspect-ratio: 16/9; }
        
        .controls { margin-top: 30px; padding: 20px; background: #1e1e1e; border-radius: 12px; display: inline-block; }
        button { padding: 15px 40px; background: #ff4b2b; color: white; border: none; border-radius: 50px; cursor: pointer; font-size: 18px; font-weight: bold; }
        
        #log-console { margin-top: 20px; height: 100px; background: #000; color: #00ff88; font-family: monospace; font-size: 11px; padding: 10px; overflow-y: scroll; text-align: left; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📍 RÉGIE NANTES</h1>

        <div class="dashboard">
            <div id="status-obs" class="stat-card offline">
                <div class="stat-label">Sortie vers OBS Paris</div>
                <div class="stat-value">HORS LIGNE</div>
            </div>
            <div id="status-paris" class="stat-card offline">
                <div class="stat-label">Retour Console Paris</div>
                <div class="stat-value">EN ATTENTE</div>
            </div>
        </div>
        
        <div class="grid">
            <div class="video-box">
                <video id="localVideo" autoplay playsinline muted></video>
                <div style="position:absolute; top:20px; left:20px; background:rgba(0,0,0,0.6); padding:5px 10px; font-size:12px;">LOCAL CAM</div>
            </div>
            <div class="video-box">
                <video id="remoteVideo" autoplay playsinline></video>
                <div style="position:absolute; top:20px; left:20px; background:rgba(255,0,0,0.6); padding:5px 10px; font-size:12px;">LIVE PARIS</div>
            </div>
        </div>

        <div class="controls">
            <button id="startBtn">🔴 LANCER LE DIRECT</button>
        </div>

        <div id="log-console">--- Système prêt ---</div>
    </div>

    <script>
        const log = (msg) => {
            const consoleDiv = document.getElementById('log-console');
            consoleDiv.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        };

        const updateUI = (id, state, text) => {
            const card = document.getElementById(`status-${id}`);
            if (!card) return;
            card.className = `stat-card ${state}`;
            card.querySelector('.stat-value').innerText = text.toUpperCase();
        };

        const sig = new WebSocket('wss://railway-webrtc-production.up.railway.app');
        const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
        let localStream;
        let pcs = {};

        // 1. Caméra
        navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
            localStream = stream;
            document.getElementById('localVideo').srcObject = stream;
            log("Caméra locale activée");
        });

        sig.onopen = () => {
            sig.send(JSON.stringify({ type: 'login', name: 'nantes' }));
            log("Connecté au serveur de signalisation Railway");
        };

        // 2. WATCHDOG DES CONNEXIONS
        const setupWatchdog = (pc, id) => {
            pc.onconnectionstatechange = () => {
                log(`État connexion ${id} : ${pc.connectionState}`);
                switch(pc.connectionState) {
                    case 'connected': updateUI(id, 'online', 'Connecté'); break;
                    case 'connecting': updateUI(id, 'pending', 'Négociation...'); break;
                    case 'disconnected':
                    case 'failed': updateUI(id, 'offline', 'Déconnecté / Erreur'); break;
                }
            };
        };

        // 3. ENVOI (Vers OBS Paris)
        document.getElementById('startBtn').onclick = async () => {
            log("Tentative de connexion à OBS Paris...");
            const pc = new RTCPeerConnection(config);
            pcs['obs_paris'] = pc;
            setupWatchdog(pc, 'obs');

            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            pc.onicecandidate = e => e.candidate && sig.send(JSON.stringify({ type: 'candidate', target: 'obs_paris', candidate: e.candidate }));

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            sig.send(JSON.stringify({ type: 'offer', target: 'obs_paris', offer: offer, from: 'nantes' }));
        };

        // 4. RÉCEPTION (Depuis Paris)
        sig.onmessage = async (msg) => {
            const data = JSON.parse(msg.data);

            if (data.type === 'offer' && data.from === 'paris') {
                log("Offre reçue de Paris, création du flux retour...");
                const pc = new RTCPeerConnection(config);
                pcs['paris'] = pc;
                setupWatchdog(pc, 'paris');

                pc.onicecandidate = e => e.candidate && sig.send(JSON.stringify({ type: 'candidate', target: 'paris', candidate: e.candidate }));
                pc.ontrack = e => {
                    document.getElementById('remoteVideo').srcObject = e.streams[0];
                    log("Vidéo de Paris affichée");
                };

                await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
                const ans = await pc.createAnswer();
                await pc.setLocalDescription(ans);
                sig.send(JSON.stringify({ type: 'answer', target: 'paris', answer: ans }));
            } 
            else if (data.type === 'answer' || data.type === 'candidate') {
                const pc = pcs[data.from === 'obs_paris' ? 'obs_paris' : 'paris'];
                if (pc) {
                    if (data.type === 'answer') await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
                    else if (pc.remoteDescription) await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
                }
            }
        };
    </script>
</body>
</html>

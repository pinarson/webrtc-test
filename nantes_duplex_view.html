<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Nantes - Régie Stable</title>
    <style>
        body { background: #0f0f0f; color: #eee; font-family: sans-serif; text-align: center; padding: 20px; }
        .grid { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        .video-box { width: 45%; background: #1e1e1e; padding: 10px; border-radius: 12px; border: 1px solid #333; }
        video { width: 100%; border-radius: 8px; background: #000; aspect-ratio: 16/9; }
        .status-bar { display: flex; justify-content: center; gap: 15px; margin: 20px 0; }
        .indicator { padding: 5px 15px; border-radius: 20px; font-size: 12px; background: #333; }
        .online { background: #006633; color: #00ff88; border: 1px solid #00ff88; }
        button { padding: 15px 30px; background: #e91111; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        #console { background: #000; color: #00ff88; font-family: monospace; padding: 10px; height: 80px; overflow-y: auto; margin-top: 20px; text-align: left; font-size: 11px; }
    </style>
</head>
<body>
    <h1>📍 CONSOLE NANTES</h1>

    <div class="status-bar">
        <div id="ind-server" class="indicator">SERVEUR: OFF</div>
        <div id="ind-out" class="indicator">SORTIE OBS: OFF</div>
        <div id="ind-in" class="indicator">RETOUR PARIS: OFF</div>
    </div>
    
    <div class="grid">
        <div class="video-box">
            <p>MA CAMÉRA</p>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
        <div class="video-box">
            <p>RETOUR PARIS</p>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>

    <div style="margin-top: 20px;">
        <button id="startCall">🔴 LANCER LE DIRECT VERS PARIS</button>
    </div>

    <div id="console">--- Initialisation système ---</div>

    <script>
        const log = (m) => { const c = document.getElementById('console'); c.innerHTML += `> ${m}<br>`; c.scrollTop = c.scrollHeight; };
        const setInd = (id, on, txt) => { const el = document.getElementById(id); el.className = on ? 'indicator online' : 'indicator'; if(txt) el.innerText = txt; };

        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const sig = new WebSocket('wss://railway-webrtc-production.up.railway.app');
        const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
        
        let localStream;
        let pcs = {}; // Le dictionnaire magique du premier exemple

        // 1. Caméra
        navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(s => {
            localStream = s;
            localVideo.srcObject = s;
            log("Caméra locale prête");
        });

        // 2. Signalisation
        sig.onopen = () => {
            sig.send(JSON.stringify({ type: 'login', name: 'nantes' }));
            setInd('ind-server', true, "SERVEUR: OK");
            log("Connecté au serveur Railway");
        };

        sig.onmessage = async (msg) => {
            const data = JSON.parse(msg.data);
            
            // Gestion automatique des offres (comme dans le premier main.js)
            if (data.type === 'offer') {
                log("Offre reçue de : " + data.from);
                const pc = createPC(data.from);
                await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
                const ans = await pc.createAnswer();
                await pc.setLocalDescription(ans);
                sig.send(JSON.stringify({ type: 'answer', target: data.from, answer: ans }));
                if(data.from === 'paris') setInd('ind-in', true, "RETOUR PARIS: LIVE");
            } 
            else if (data.type === 'answer') {
                if (pcs[data.from]) {
                    await pcs[data.from].setRemoteDescription(new RTCSessionDescription(data.answer));
                    if(data.from === 'obs_paris') setInd('ind-out', true, "SORTIE OBS: OK");
                }
            } 
            else if (data.type === 'candidate') {
                if (pcs[data.from]) {
                    await pcs[data.from].addIceCandidate(new RTCIceCandidate(data.candidate)).catch(e => {});
                }
            }
        };

        // 3. Création de connexion générique
        function createPC(target) {
    // Si une connexion existe déjà pour ce target, on la ferme proprement
    if (pcs[target]) {
        log("🔄 Nettoyage de l'ancienne connexion : " + target);
        pcs[target].close();
    }

    const pc = new RTCPeerConnection(config);
    pcs[target] = pc;

    pc.onicecandidate = e => {
        if (e.candidate) sig.send(JSON.stringify({ type: 'candidate', target: target, candidate: e.candidate }));
    };

    pc.ontrack = e => {
        log("🎬 Flux matériel reçu de : " + target);
        
        if (target === 'paris') {
            const rv = document.getElementById('remoteVideo');
            
            // On branche le flux
            if (rv.srcObject !== e.streams[0]) {
                rv.srcObject = e.streams[0];
            }

            // FORCE L'AFFICHAGE : Très important
            rv.play().then(() => {
                log("✅ AFFICHAGE ACTIF : " + target);
            }).catch(err => {
                log("⚠️ Blocage navigateur : CLIQUEZ SUR LA PAGE pour voir Paris");
                // On débloque au premier clic sur le document
                document.onclick = () => {
                    rv.play();
                    log("🔊 Audio/Vidéo débloqués par clic");
                };
            });
        }
    };

    if (localStream) {
        localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
    }

    return pc;
}

        // 4. Lancer l'appel
        document.getElementById('startCall').onclick = async () => {
            log("Appel de obs_paris...");
            const pc = createPC('obs_paris');
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            sig.send(JSON.stringify({ type: 'offer', target: 'obs_paris', offer: offer, from: 'nantes' }));
        };
    </script>
</body>
</html>

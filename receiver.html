<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>OBS Receiver WebRTC</title>
    <style>
        body { margin: 0; background: black; overflow: hidden; font-family: sans-serif; }
        video { width: 100vw; height: 100vh; object-fit: contain; }
        #status { position: absolute; top: 10px; left: 10px; color: rgba(255,255,255,0.5); font-size: 10px; }
    </style>
</head>
<body>
    <div id="status">En attente de connexion...</div>
    <video id="v" autoplay playsinline muted></video> 

    <script>
        const status = document.getElementById('status');
        const urlParams = new URLSearchParams(window.location.search);
        
        // On récupère l'ID depuis l'URL (ex: ?id=obs_nantes&from=nantes)
        const MY_ID = urlParams.get('id'); 
        const FROM_ID = urlParams.get('from'); 

        if (!MY_ID || !FROM_ID) {
            status.innerText = "ERREUR : Paramètres id ou from manquants dans l'URL";
        }

        const sig = new WebSocket('wss://railway-webrtc-production.up.railway.app');
        const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
        let pc;

        sig.onopen = () => {
            sig.send(JSON.stringify({ type: 'login', name: MY_ID }));
            status.innerText = "Connecté au serveur en tant que " + MY_ID;
        };

        sig.onmessage = async (msg) => {
            const data = JSON.parse(msg.data);
            
            // On n'accepte l'offre que si elle vient de l'émetteur attendu
            if (data.type === 'offer' && data.from === FROM_ID) {
                status.innerText = "Réception du flux de " + data.from + "...";
                
                pc = new RTCPeerConnection(config);
                
                pc.onicecandidate = (e) => {
                    if (e.candidate) {
                        sig.send(JSON.stringify({type:'candidate', target:data.from, candidate:e.candidate}));
                    }
                };

                pc.ontrack = (e) => {
                    console.log("Flux vidéo reçu !");
                    status.innerText = "DIRECT : " + FROM_ID;
                    document.getElementById('v').srcObject = e.streams[0];
                    // Petit délai pour cacher le statut
                    setTimeout(() => { status.style.display = 'none'; }, 2000);
                };

                await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
                const ans = await pc.createAnswer();
                await pc.setLocalDescription(ans);
                sig.send(JSON.stringify({type:'answer', target:data.from, answer:ans}));
            } 
            else if (data.type === 'candidate' && pc) {
                await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        };

        sig.onclose = () => { status.innerText = "Déconnecté du serveur"; };
    </script>
</body>
</html>

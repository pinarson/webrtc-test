<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>OBS Receiver</title>
    <style>
        body { margin: 0; background: black; overflow: hidden; }
        video { width: 100vw; height: 100vh; object-fit: contain; }
    </style>
</head>
<body>
    <video id="remoteVideo" autoplay playsinline></video>

    <script>
        // CONFIGURATION
        const urlParams = new URLSearchParams(window.location.search);
        const SOURCE_TO_WATCH = urlParams.get('from') || 'nantes'; // Qui on veut regarder
        const MY_ID = "obs_" + Math.floor(Math.random() * 1000); // ID unique pour OBS
        
        const signaling = new WebSocket('wss://railway-webrtc-production.up.railway.app');
        const configuration = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
        let pc;

        signaling.onopen = () => {
            // 1. On se connecte au serveur
            signaling.send(JSON.stringify({ type: 'login', name: MY_ID }));
            console.log("Connecté en tant que " + MY_ID + ". J'attends le flux de " + SOURCE_TO_WATCH);
        };

        signaling.onmessage = async (message) => {
            const data = JSON.parse(message.data);

            // 2. Si on reçoit une offre de la source qu'on surveille
            if (data.type === 'offer' && data.from === SOURCE_TO_WATCH) {
                pc = new RTCPeerConnection(configuration);
                
                pc.onicecandidate = (event) => {
                    if (event.candidate) {
                        signaling.send(JSON.stringify({ 
                            type: 'candidate', target: data.from, candidate: event.candidate 
                        }));
                    }
                };

                pc.ontrack = (event) => {
                    document.getElementById('remoteVideo').srcObject = event.streams[0];
                };

                await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                
                signaling.send(JSON.stringify({ 
                    type: 'answer', target: data.from, answer: answer 
                }));
            } 
            // 3. Gestion des candidats ICE
            else if (data.type === 'candidate' && pc) {
                await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>OBS FLUX HD</title>
    <style>
        body { margin: 0; background: black; overflow: hidden; }
        video { width: 1920px; height: 1080px; object-fit: cover; }
    </style>
</head>
<body>
    <video id="v" autoplay playsinline muted></video>
    <script>
        const sig = new WebSocket('wss://railway-webrtc-production.up.railway.app');
        const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
        let pc;

        // On s'identifie comme le récepteur attendu par Nantes
        sig.onopen = () => sig.send(JSON.stringify({ type: 'login', name: 'obs_receiver' }));

        sig.onmessage = async (msg) => {
            const data = JSON.parse(msg.data);
            if (data.type === 'offer' && data.from === 'nantes') {
                pc = new RTCPeerConnection(config);
                pc.onicecandidate = e => e.candidate && sig.send(JSON.stringify({ type: 'candidate', target: 'nantes', candidate: e.candidate }));
                pc.ontrack = e => { document.getElementById('v').srcObject = e.streams[0]; };
                
                await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
                const ans = await pc.createAnswer();
                await pc.setLocalDescription(ans);
                sig.send(JSON.stringify({ type: 'answer', target: 'nantes', answer: ans }));
            } else if (data.type === 'candidate' && pc) {
                await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        };
    </script>
</body>
</html>

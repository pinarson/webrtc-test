<!DOCTYPE html>
<html>
<head>
    <title>OBS Receiver</title>
    <style>body { margin: 0; background: black; overflow: hidden; } video { width: 100vw; height: 100vh; object-fit: contain; }</style>
</head>
<body>
    <video id="remoteVideo" autoplay playsinline></video>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const MY_ID = urlParams.get('id') || 'obs_default';
        const FROM_ID = urlParams.get('from') || 'nantes';

        const signaling = new WebSocket('wss://railway-webrtc-production.up.railway.app');
        const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
        let pc;

        signaling.onopen = () => signaling.send(JSON.stringify({ type: 'login', name: MY_ID }));

        signaling.onmessage = async (msg) => {
            const data = JSON.parse(msg.data);
            if (data.type === 'offer' && data.from === FROM_ID) {
                pc = new RTCPeerConnection(config);
                pc.onicecandidate = (e) => e.candidate && signaling.send(JSON.stringify({ type: 'candidate', target: data.from, candidate: e.candidate }));
                pc.ontrack = (e) => document.getElementById('remoteVideo').srcObject = e.streams[0];
                await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                signaling.send(JSON.stringify({ type: 'answer', target: data.from, answer: answer }));
            } else if (data.type === 'candidate' && pc) {
                await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        };
    </script>
</body>
</html>

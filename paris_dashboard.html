<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Console PARIS - Dashboard</title>
    <style>
        body { background: #0f0f0f; color: #eee; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; margin: 0; }
        h1 { margin-bottom: 10px; color: #00d4ff; }

        /* SÉLECTEURS SOUS LE TITRE */
        .selectors { 
            background: #1e1e1e; padding: 12px 20px; border-radius: 50px; 
            margin: 0 auto 25px auto; display: inline-flex; gap: 25px; 
            border: 1px solid #333; align-items: center;
        }
        .select-group { text-align: left; display: flex; align-items: center; gap: 10px; }
        label { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; }
        select { 
            background: #000; color: #00d4ff; border: 1px solid #444; 
            padding: 6px 12px; border-radius: 20px; min-width: 180px; 
            outline: none; font-size: 12px; cursor: pointer;
        }

        /* Dashboard Stats */
        .dashboard { display: flex; justify-content: center; gap: 15px; margin-bottom: 25px; }
        .stat-card { background: #1e1e1e; padding: 12px 20px; border-radius: 8px; border-left: 5px solid #444; min-width: 180px; text-align: left; transition: 0.3s; }
        .online { border-left-color: #00d4ff; box-shadow: 0 0 10px rgba(0, 212, 255, 0.2); }
        .pending { border-left-color: #ffab00; }
        .offline { border-left-color: #ff3333; }
        .stat-label { font-size: 10px; color: #888; text-transform: uppercase; }
        .stat-value { font-size: 14px; font-weight: bold; margin-top: 4px; }

        video { width: 80%; max-width: 900px; border: 2px solid #333; border-radius: 12px; background: black; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .controls { margin-top: 25px; }
        button { padding: 18px 40px; background: #00d4ff; color: #111; border: none; border-radius: 50px; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.3s; }
        button:hover { background: #00b8e6; transform: scale(1.05); }

        #log-console { max-width: 900px; margin: 25px auto 0; height: 100px; background: #000; color: #00d4ff; font-family: monospace; font-size: 11px; padding: 15px; overflow-y: auto; text-align: left; border-radius: 8px; border: 1px solid #333; }
    </style>
</head>
<body>
    <h1>📍 CONSOLE PARIS</h1>

    <div class="selectors">
        <div class="select-group">
            <label>Vidéo</label>
            <select id="videoSource"></select>
        </div>
        <div class="select-group">
            <label>Micro</label>
            <select id="audioSource"></select>
        </div>
    </div>

    <div class="dashboard">
        <div id="status-server" class="stat-card offline">
            <div class="stat-label">Signalisation Railway</div>
            <div class="stat-value">DÉCONNECTÉ</div>
        </div>
        <div id="status-webrtc" class="stat-card offline">
            <div class="stat-label">Lien WebRTC (Flux)</div>
            <div class="stat-value">HORS LIGNE</div>
        </div>
    </div>

    <video id="localVideo" autoplay playsinline muted></video>
    
    <div class="controls">
        <button id="startBtn">🔴 ENVOYER LE FLUX VERS RECEIVER_TO_PARIS</button>
    </div>

    <div id="log-console">> Prêt à Paris...</div>

    <script>
        const log = (m) => {
            const c = document.getElementById('log-console');
            c.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${m}</div>`;
            c.scrollTop = c.scrollHeight;
        };

        const updateUI = (id, state, txt) => {
            const el = document.getElementById(`status-${id}`);
            if(el) {
                el.className = `stat-card ${state}`;
                el.querySelector('.stat-value').innerText = txt.toUpperCase();
            }
        };

        const videoSelect = document.querySelector('select#videoSource');
        const audioSelect = document.querySelector('select#audioSource');
        const sig = new WebSocket('wss://railway-webrtc-production.up.railway.app');
        const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
        let localStream, pc, watchdogTimer = null;

        // --- GESTION DES SOURCES ---
        async function getDevices() {
            const devices = await navigator.mediaDevices.enumerateDevices();
            videoSelect.innerHTML = ''; audioSelect.innerHTML = '';
            devices.forEach(device => {
                const option = document.createElement('option');
                option.value = device.deviceId;
                if (device.kind === 'videoinput') {
                    option.text = device.label || `Caméra ${videoSelect.length + 1}`;
                    videoSelect.appendChild(option);
                } else if (device.kind === 'audioinput') {
                    option.text = device.label || `Micro ${audioSelect.length + 1}`;
                    audioSelect.appendChild(option);
                }
            });
        }

        async function startCapture() {
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            const constraints = {
                video: { deviceId: videoSelect.value ? { exact: videoSelect.value } : undefined, width: 1920, height: 1080 },
                audio: { deviceId: audioSelect.value ? { exact: audioSelect.value } : undefined }
            };
            try {
                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById('localVideo').srcObject = localStream;
                if (pc) {
                    const vTrack = localStream.getVideoTracks()[0];
                    const aTrack = localStream.getAudioTracks()[0];
                    pc.getSenders().find(s => s.track.kind === 'video').replaceTrack(vTrack);
                    pc.getSenders().find(s => s.track.kind === 'audio').replaceTrack(aTrack);
                    log("Switch de source réussi.");
                }
            } catch (e) { log("Erreur : " + e.message); }
        }

        navigator.mediaDevices.getUserMedia({ audio: true, video: true }).then(() => getDevices().then(startCapture));
        videoSelect.onchange = startCapture;
        audioSelect.onchange = startCapture;

        sig.onopen = () => {
            sig.send(JSON.stringify({ type: 'login', name: 'paris' }));
            updateUI('server', 'online', 'Connecté');
            log("Railway : Paris identifié.");
        };

        // --- ENVOI VERS RECEIVER_TO_PARIS ---
        async function startStreaming() {
            log("🔄 WebRTC : Négociation avec le récepteur...");
            updateUI('webrtc', 'pending', 'En cours...');
            if (pc) pc.close();
            pc = new RTCPeerConnection(config);
            
            pc.onconnectionstatechange = () => {
                if (pc.connectionState === 'connected') {
                    updateUI('webrtc', 'online', 'Flux Actif');
                    clearTimeout(watchdogTimer); watchdogTimer = null;
                } else if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
                    updateUI('webrtc', 'offline', 'Lien Perdu');
                    if (!watchdogTimer) {
                        watchdogTimer = setTimeout(() => {
                            log("🔄 Auto-Healing : Relance...");
                            startStreaming();
                            watchdogTimer = null;
                        }, 5000);
                    }
                }
            };

            localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
            pc.onicecandidate = e => e.candidate && sig.send(JSON.stringify({ type: 'candidate', target: 'obs_paris', candidate: e.candidate }));
            
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            // On envoie à "obs_paris" qui est le nom écouté par receiver_to_paris.html
            sig.send(JSON.stringify({ type: 'offer', target: 'obs_paris', offer, from: 'paris' }));
        }

        document.getElementById('startBtn').onclick = startStreaming;
        sig.onmessage = async (m) => {
            const d = JSON.parse(m.data);
            if (d.type === 'answer' && pc) await pc.setRemoteDescription(new RTCSessionDescription(d.answer));
            if (d.type === 'candidate' && pc) await pc.addIceCandidate(new RTCIceCandidate(d.candidate)).catch(()=>{});
        };
    </script>
</body>
</html>
